name: Compatibility list

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  discussions: write
  contents: read

jobs:
  update-discussion:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch aircons JSON and update Discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          JSON_DATA=$(curl -fsSL "https://www.faircon.lt/aircons/json")
          echo "$JSON_DATA" | jq -e 'type == "array"' > /dev/null

          BODY_CONTENT=$(node -e '
            const data = JSON.parse(process.argv[1]);
            const total = data.length;
            const compatibleCount = data.filter((x) => x.compatible === true).length;
            const testedCount = data.filter((x) => x.tested === true).length;
            const withConnectorCount = data.filter((x) => Boolean(x.connector)).length;

            const updatedAt = new Date().toISOString().replace("T", " ").slice(0, 19) + " UTC";

            const lines = [
              "## Fujitsu AC Compatibility List",
              "",
              `Last updated: \`${updatedAt}\``,
              "",
              "| Metric | Count |",
              "|---|---:|",
              `| Total models | ${total} |`,
              `| Compatible | ${compatibleCount} |`,
              `| Tested | ${testedCount} |`,
              `| Connector specified | ${withConnectorCount} |`,
              "",
              "| Model | Compatible | Tested | Connector |",
              "|---|:---:|:---:|---|"
            ];

            for (const item of data) {
              const model = item.model ?? "-";
              const compat = item.compatible ? "Yes" : "No";
              const tested = item.tested ? "Yes" : "No";
              const connector = item.connector ? `\`${item.connector}\`` : "—";
              lines.push(`| \`${model}\` | ${compat} | ${tested} | ${connector} |`);
            }

            process.stdout.write(lines.join("\n"));
          ' "$JSON_DATA")

          DISCUSSION_ID=$(gh api graphql \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  discussion(number: $number) {
                    id
                  }
                }
              }' \
            -F owner="$REPO_OWNER" \
            -F name="$REPO_NAME" \
            -F number=24 \
            --jq '.data.repository.discussion.id // empty')

          if [ -z "$DISCUSSION_ID" ]; then
            echo "Error: Discussion #24 not found in ${REPO_OWNER}/${REPO_NAME}."
            exit 1
          fi

          gh api graphql \
            -f query='
              mutation($discussionId: ID!, $body: String!) {
                updateDiscussion(input: { discussionId: $discussionId, body: $body }) {
                  discussion {
                    id
                    url
                  }
                }
              }' \
            -F discussionId="$DISCUSSION_ID" \
            -f body="$BODY_CONTENT"